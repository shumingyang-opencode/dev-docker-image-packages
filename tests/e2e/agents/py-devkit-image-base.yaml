image: py-devkit-image-base
ghcr_repo: ghcr.io/shumingyang-opencode/py-devkit-image-base

agents:
  - name: opencode
    binary: opencode
    env_vars: [OPENCODE_API_KEY]
    run_cmd: 'opencode run {prompt}'

  - name: copilot
    binary: copilot
    env_vars: [COPILOT_GITHUB_TOKEN, GH_TOKEN, GITHUB_TOKEN]
    run_cmd: 'echo {prompt} | copilot'

  - name: gemini
    binary: gemini
    env_vars: [GEMINI_API_KEY]
    run_cmd: 'export GEMINI_CLI_TRUST_WORKSPACE=true && echo {prompt} | gemini ask - --model gemini-2.5-flash'

  - name: lark-cli
    binary: lark-cli
    env_vars: []

  - name: trae-cli
    binary: trae-cli
    supports_model: true
    env_vars: [OPENAI_API_KEY, ANTHROPIC_API_KEY, OPENROUTER_API_KEY, DOUBAO_API_KEY]
    run_cmd: 'trae-cli run {prompt}'
